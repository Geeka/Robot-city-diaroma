<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Greeter - Gen AI Robot City</title>

    <!-- PWA / full-screen kiosk (Add to Home Screen -> no browser bars) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f23">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Greeter">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Load shared configuration -->
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin: 8px 0;
            font-size: 22px;
            text-shadow: 0 0 15px #00ff88;
        }

        .card {
            background: rgba(45, 55, 72, 0.8);
            border: 2px solid #4a5568;
            border-radius: 15px;
            padding: 22px;
            margin: 20px auto;
            max-width: 480px;
        }

        .btn {
            background: linear-gradient(45deg, #00ff88, #4ecdc4);
            border: none;
            color: #0f0f23;
            padding: 16px 30px;
            border-radius: 30px;
            font-family: inherit;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin: 14px 5px 4px;
        }

        .btn.small {
            font-size: 13px;
            padding: 10px 18px;
            background: #4a5568;
            color: #e2e8f0;
        }

        /* ===== Full-body animated character ===== */
        .bot-face { width: 200px; height: 272px; margin: 0 auto; }
        .bot-face svg { width: 100%; height: 100%; overflow: visible; display: block; }

        .bot-face.idle { animation: bob 2.8s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

        .bot-face.talking { animation: bounce 0.3s ease-in-out infinite alternate;
                            filter: drop-shadow(0 0 22px #38e1ff); }
        @keyframes bounce { from { transform: translateY(2px) scale(1); }
                            to   { transform: translateY(-7px) scale(1.04); } }

        /* Mouth flaps */
        .bot-face .mouth { transform-box: fill-box; transform-origin: center; }
        .bot-face.talking .mouth { animation: chomp 0.17s ease-in-out infinite alternate; }
        @keyframes chomp { from { transform: scaleY(0.22); } to { transform: scaleY(1); } }

        /* Blink */
        .bot-face .lid { transform-box: fill-box; transform-origin: center; transform: scaleY(0);
                         animation: blink 4.8s infinite; }
        @keyframes blink { 0%,93%,100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }

        /* Lights pulse (gentle always, faster while talking) */
        .bot-face .bulb { transform-box: fill-box; transform-origin: center; animation: bulbIdle 2.4s ease-in-out infinite; }
        .bot-face.talking .bulb { animation: bulb 0.45s ease-in-out infinite alternate; }
        @keyframes bulbIdle { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
        @keyframes bulb { from { opacity: .5; } to { opacity: 1; } }

        /* Cheeks pulse while talking */
        .bot-face .cheek { opacity: 0; }
        .bot-face.talking .cheek { opacity: .9; animation: cheekPulse 0.5s ease-in-out infinite alternate; }
        @keyframes cheekPulse { from { opacity: .5; } to { opacity: 1; } }

        /* Arms: sway idle, big wave talking */
        .bot-face .arm { transform-box: view-box; }
        .bot-face .arm-left  { transform-origin: 70px 174px; }
        .bot-face .arm-right { transform-origin: 150px 174px; }
        .bot-face.idle .arm-left  { animation: swayL 3.2s ease-in-out infinite; }
        .bot-face.idle .arm-right { animation: swayR 3.2s ease-in-out infinite; }
        .bot-face.talking .arm-left  { animation: waveL 0.4s ease-in-out infinite alternate; }
        .bot-face.talking .arm-right { animation: waveR 0.4s ease-in-out infinite alternate; }
        @keyframes swayL { 0%,100% { transform: rotate(5deg); }  50% { transform: rotate(-3deg); } }
        @keyframes swayR { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(3deg); } }
        @keyframes waveL { from { transform: rotate(14deg); }  to { transform: rotate(-32deg); } }
        @keyframes waveR { from { transform: rotate(-14deg); } to { transform: rotate(32deg); } }

        /* Legs march while talking */
        .bot-face .leg { transform-box: view-box; }
        .bot-face .leg-left  { transform-origin: 99px 240px; }
        .bot-face .leg-right { transform-origin: 121px 240px; }
        .bot-face.talking .leg-left  { animation: stepL 0.5s ease-in-out infinite; }
        .bot-face.talking .leg-right { animation: stepR 0.5s ease-in-out infinite; }
        @keyframes stepL { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-7deg); } }
        @keyframes stepR { 0%,100% { transform: translateY(-6px) rotate(7deg); } 50% { transform: translateY(0) rotate(0); } }

        /* Chest equalizer bars bounce while talking */
        .bot-face .eq { transform-box: fill-box; transform-origin: center bottom; }
        .bot-face.talking .eq1 { animation: eqA 0.42s ease-in-out infinite alternate; }
        .bot-face.talking .eq2 { animation: eqB 0.38s ease-in-out infinite alternate; }
        .bot-face.talking .eq3 { animation: eqC 0.30s ease-in-out infinite alternate; }
        .bot-face.talking .eq4 { animation: eqB 0.34s ease-in-out infinite alternate; }
        .bot-face.talking .eq5 { animation: eqA 0.46s ease-in-out infinite alternate; }
        @keyframes eqA { from { transform: scaleY(.35); } to { transform: scaleY(1.1); } }
        @keyframes eqB { from { transform: scaleY(.5); }  to { transform: scaleY(1.2); } }
        @keyframes eqC { from { transform: scaleY(.3); }  to { transform: scaleY(1.3); } }

        /* Sound-wave ripples while talking */
        .bot-face .wave { opacity: 0; transform-box: fill-box; }
        .bot-face.talking .wave-l  { animation: sndL 1s ease-out infinite; }
        .bot-face.talking .wave-l2 { animation: sndL 1s ease-out infinite 0.3s; }
        .bot-face.talking .wave-r  { animation: sndR 1s ease-out infinite; }
        .bot-face.talking .wave-r2 { animation: sndR 1s ease-out infinite 0.3s; }
        @keyframes sndR { 0% { opacity: 0; transform: translateX(-4px); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateX(8px); } }
        @keyframes sndL { 0% { opacity: 0; transform: translateX(4px); }  30% { opacity: .8; } 100% { opacity: 0; transform: translateX(-8px); } }

        @media (prefers-reduced-motion: reduce) {
            .bot-face, .bot-face * { animation: none !important; }
        }

        /* ===== Landscape: character beside the text ===== */
        @media (orientation: landscape) {
            #runPanel { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
                        gap: 28px; max-width: 860px; }
            #runPanel .bot-face { flex: 0 0 auto; margin: 0; }
            #runPanel .run-info { flex: 1 1 260px; min-width: 220px; text-align: center; }
            .run-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        }
        /* Short landscape screens (phones): shrink so nothing is cut off */
        @media (orientation: landscape) and (max-height: 520px) {
            body { padding: 10px; }
            .bot-face { width: 155px; height: 210px; }
            h1 { font-size: 18px; }
            #currentName { font-size: 36px; min-height: 42px; }
            .card { padding: 14px; margin: 8px auto; }
        }

        .label { color: #718096; font-size: 12px; margin-top: 8px; }

        #currentName {
            font-size: 44px;
            color: #ffe66d;
            margin: 10px 0;
            word-break: break-word;
            min-height: 54px;
        }

        #status { color: #4ecdc4; font-size: 14px; margin-top: 8px; }
        #diag { font-size: 11px; color: #718096; margin-top: 8px; }
        .error { color: #ff6b6b; font-size: 13px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- START SCREEN -->
    <div id="startCard" class="card">
        <div class="bot-face idle"></div>
        <h1>GREETER</h1>
        <p style="font-size: 13px; margin-top: 8px;">Keep this phone next to the robot. It announces hello to new visitors.</p>
        <button class="btn" onclick="startGreeter()">▶ Start Greeter</button>
        <p id="startError" class="error"></p>
        <p style="font-size: 11px; color: #718096; margin-top: 12px;">Turn volume up, plug in charger. Use Chrome or Safari.</p>
    </div>

    <!-- RUNNING SCREEN -->
    <div id="runPanel" class="card hidden">
        <div id="robotIcon" class="bot-face idle"></div>
        <div class="run-info">
            <p class="label">LAST GREETED</p>
            <div id="currentName">—</div>
            <p id="status">Connecting...</p>
            <p id="diag"></p>
            <p id="warning" class="error hidden"></p>
            <div class="run-buttons">
                <button class="btn small" onclick="testGreeting()">🔊 Test greeting</button>
                <button class="btn small" onclick="goFullscreen()">⛶ Full screen</button>
            </div>
        </div>
    </div>

    <script>
        // ================= GLOBAL ERROR REPORTER =================
        // Surfaces any script error on the page (mobile has no easy console).
        window.addEventListener('error', function (ev) {
            var box = document.getElementById('startError');
            if (box) {
                box.textContent = '⚠️ Script error: ' + (ev.message || ev.error || 'unknown')
                    + (ev.lineno ? ' (line ' + ev.lineno + ')' : '');
            }
        });

        // ================= CONFIG =================
        // All configuration loaded from config.js. The fallbacks below assign to
        // window.X (assignment, not declaration) so they can never clash with
        // config.js whether it uses const or var, or fails to load at all.
        if (typeof VISITOR_API === 'undefined') {
            window.VISITOR_API = 'https://script.google.com/macros/s/AKfycbwLHMAkVKMJX4UYJcTzS0oX1Z2plHMYtv9WA-drsIKhx0WHO6J2bt6N_OI9lDWXPMlJ/exec';
        }
        if (typeof VOICE_SETTINGS === 'undefined') {
            window.VOICE_SETTINGS = { style: 'machine', voiceName: '', female: true, chirp: true, machineWordByWord: true };
        }
        if (typeof VOICE_STYLES === 'undefined') {
            window.VOICE_STYLES = {
                machine:  { pitch: 0.3, rate: 0.8,  wordByWord: true  },
                deep:     { pitch: 0.1, rate: 0.75, wordByWord: false },
                friendly: { pitch: 1.1, rate: 0.95, wordByWord: false },
                squeaky:  { pitch: 1.9, rate: 1.1,  wordByWord: false }
            };
        }
        if (typeof POLL_MS === 'undefined') {
            window.POLL_MS = 4000;
        }
        if (typeof REPLY_TIMEOUT === 'undefined') {
            window.REPLY_TIMEOUT = 15000;
        }
        if (typeof SETTINGS_REFRESH_MS === 'undefined') {
            window.SETTINGS_REFRESH_MS = 60000;
        }
        if (typeof DEFAULT_GREETING === 'undefined') {
            window.DEFAULT_GREETING = 'Welcome {name}!';
        }
        if (typeof ROBOTIC_VOICE_NAMES === 'undefined') {
            window.ROBOTIC_VOICE_NAMES = /zarvox|trinoids|robot|espeak/i;
        }
        if (typeof FEMALE_VOICE_NAMES === 'undefined') {
            window.FEMALE_VOICE_NAMES = /female|zira|heera|veena|samantha|karen|moira|tessa|fiona|victoria|allison|ava|susan|zoe|nicky|serena|kate|google us english/i;
        }

        // ================= CHARACTER (animated, Voice-Tooner style) =================
        const BOT_SVG = `<svg viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#eef3f7"/><stop offset=".42" stop-color="#c3ccd5"/>
                    <stop offset=".52" stop-color="#dfe7ee"/><stop offset=".62" stop-color="#aeb9c3"/><stop offset="1" stop-color="#8994a0"/>
                </linearGradient>
                <linearGradient id="crd" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#dfe6ec"/><stop offset="1" stop-color="#7c8792"/>
                </linearGradient>
                <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#1a222e"/><stop offset="1" stop-color="#0a0e14"/>
                </linearGradient>
            </defs>
            <!-- antenna (red light) -->
            <line x1="110" y1="42" x2="110" y2="60" stroke="#9aa6b2" stroke-width="3" stroke-linecap="round"/>
            <circle class="bulb" cx="110" cy="32" r="8" fill="#ff5a5a"/>
            <circle cx="108" cy="30" r="2" fill="#ffd0d0"/>
            <!-- legs + boots (grouped for marching) -->
            <g class="leg leg-left">
                <rect x="92" y="240" width="14" height="34" rx="7" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
                <rect x="84" y="270" width="30" height="15" rx="7" fill="#6b7681" stroke="#4a5560" stroke-width="1.5"/>
            </g>
            <g class="leg leg-right">
                <rect x="114" y="240" width="14" height="34" rx="7" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
                <rect x="106" y="270" width="30" height="15" rx="7" fill="#6b7681" stroke="#4a5560" stroke-width="1.5"/>
            </g>
            <!-- arms (chrome, jointed) -->
            <g class="arm arm-left">
                <circle cx="72" cy="174" r="7" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
                <rect x="56" y="172" width="14" height="40" rx="7" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
                <circle cx="63" cy="216" r="11" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
            </g>
            <g class="arm arm-right">
                <circle cx="148" cy="174" r="7" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
                <rect x="150" y="172" width="14" height="40" rx="7" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
                <circle cx="157" cy="216" r="11" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
            </g>
            <!-- neck -->
            <rect x="101" y="146" width="18" height="18" rx="4" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
            <!-- torso -->
            <rect x="72" y="160" width="76" height="82" rx="22" fill="url(#cr)" stroke="#4a5560" stroke-width="1.5"/>
            <ellipse cx="98" cy="176" rx="22" ry="8" fill="#ffffff" opacity=".22"/>
            <!-- chest equalizer -->
            <rect x="88" y="176" width="44" height="40" rx="8" fill="url(#vs)" stroke="#05080c" stroke-width="1"/>
            <rect class="eq eq1" x="92" y="200" width="5" height="10" rx="2" fill="#38e1ff"/>
            <rect class="eq eq2" x="100" y="194" width="5" height="16" rx="2" fill="#38e1ff"/>
            <rect class="eq eq3" x="108" y="188" width="5" height="22" rx="2" fill="#38e1ff"/>
            <rect class="eq eq4" x="116" y="194" width="5" height="16" rx="2" fill="#38e1ff"/>
            <rect class="eq eq5" x="124" y="200" width="5" height="10" rx="2" fill="#38e1ff"/>
            <circle class="bulb" cx="110" cy="228" r="5" fill="#38e1ff"/>
            <!-- head ears -->
            <circle cx="58" cy="102" r="11" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
            <circle cx="58" cy="102" r="4" fill="#8a95a1"/>
            <circle cx="162" cy="102" r="11" fill="url(#crd)" stroke="#4a5560" stroke-width="1.5"/>
            <circle cx="162" cy="102" r="4" fill="#8a95a1"/>
            <!-- dome head -->
            <rect x="58" y="56" width="104" height="92" rx="42" fill="url(#cr)" stroke="#4a5560" stroke-width="1.5"/>
            <ellipse cx="92" cy="76" rx="32" ry="12" fill="#ffffff" opacity=".30"/>
            <!-- visor -->
            <rect x="72" y="84" width="76" height="36" rx="18" fill="url(#vs)" stroke="#05080c" stroke-width="1.5"/>
            <!-- lens eyes -->
            <circle cx="94" cy="102" r="13" fill="#38e1ff" opacity=".22"/>
            <circle cx="126" cy="102" r="13" fill="#38e1ff" opacity=".22"/>
            <circle cx="94" cy="102" r="11" fill="#0c1520" stroke="#2b3a4a" stroke-width="1"/>
            <circle cx="126" cy="102" r="11" fill="#0c1520" stroke="#2b3a4a" stroke-width="1"/>
            <circle cx="94" cy="102" r="7" fill="#38e1ff"/>
            <circle cx="126" cy="102" r="7" fill="#38e1ff"/>
            <circle cx="91" cy="99" r="2.5" fill="#eaffff"/>
            <circle cx="123" cy="99" r="2.5" fill="#eaffff"/>
            <rect class="lid" x="81" y="89" width="26" height="26" rx="8" fill="#10151c"/>
            <rect class="lid" x="113" y="89" width="26" height="26" rx="8" fill="#10151c"/>
            <!-- cheeks + mouth -->
            <circle class="cheek" cx="78" cy="128" r="3.5" fill="#38e1ff"/>
            <circle class="cheek" cx="142" cy="128" r="3.5" fill="#38e1ff"/>
            <rect class="mouth" x="96" y="126" width="28" height="10" rx="5" fill="url(#vs)" stroke="#38e1ff" stroke-width="1"/>
            <!-- sound-wave ripples -->
            <path class="wave wave-l" d="M74 90 q-12 12 0 24" fill="none" stroke="#38e1ff" stroke-width="2.5" stroke-linecap="round"/>
            <path class="wave wave-l2" d="M66 86 q-16 16 0 32" fill="none" stroke="#38e1ff" stroke-width="2.5" stroke-linecap="round"/>
            <path class="wave wave-r" d="M146 90 q12 12 0 24" fill="none" stroke="#38e1ff" stroke-width="2.5" stroke-linecap="round"/>
            <path class="wave wave-r2" d="M154 86 q16 16 0 32" fill="none" stroke="#38e1ff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>`;
        // Each copy gets unique gradient ids, so hiding the start screen never
        // breaks the running character's colors (duplicate ids resolve to the first
        // one in the DOM, which disappears when that screen is hidden).
        document.querySelectorAll('.bot-face').forEach((el, i) => {
            let svg = BOT_SVG;
            ['cr', 'crd', 'vs'].forEach(id => {
                svg = svg.split('id="' + id + '"').join('id="' + id + i + '"')
                         .split('url(#' + id + ')').join('url(#' + id + i + ')');
            });
            el.innerHTML = svg;
        });

        // ================= STATE =================
        let settings = {};
        let settingsNote = 'defaults';
        let started = false;
        let polling = false;
        let pollTimer = null;
        let lastPollAt = 0;
        let lastCount = null;
        let lastChecked = '';
        let wakeLock = null;
        let busy = false;
        const queue = [];
        let audioCtx = null;

        // ================= DIAGNOSTICS =================
        function updateDiag() {
            const msg = `greeter v2 • settings: ${settingsNote}` + 
                        (lastChecked ? ` • checked ${lastChecked}` : '');
            document.getElementById('diag').textContent = msg;
        }

        // ================= LOADING DATA FROM GOOGLE =================
        function loadJsonp(makeSrc, parse, timeoutMsg) {
            return new Promise((resolve, reject) => {
                const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
                const s = document.createElement('script');
                let settled = false;

                const cleanup = () => {
                    settled = true;
                    clearTimeout(timer);
                    window[cb] = function () {};
                    s.remove();
                };

                const timer = setTimeout(() => {
                    if (settled) return;
                    cleanup();
                    reject(new Error(timeoutMsg));
                }, REPLY_TIMEOUT);

                window[cb] = data => {
                    if (settled) return;
                    cleanup();
                    try { resolve(parse(data)); } catch (e) { reject(e); }
                };

                s.onerror = () => {
                    if (settled) return;
                    cleanup();
                    reject(new Error('network problem'));
                };

                s.src = makeSrc(cb);
                document.body.appendChild(s);
            });
        }

        function readVisitors() {
            return loadJsonp(
                cb => `${VISITOR_API}?callback=${cb}&t=${Date.now()}`,
                data => {
                    if (!data) throw new Error('empty reply');
                    if (data.error) throw new Error(data.error);
                    return { count: data.count || 0, recent: data.recent || [] };
                },
                'no reply in 15s'
            );
        }

        async function loadSettings() {
            try {
                const saved = await loadJsonp(
                    cb => `${VISITOR_API}?action=getSettings&callback=${cb}&t=${Date.now()}`,
                    data => {
                        if (!data) throw new Error('empty reply');
                        if (data.error) throw new Error(data.error);
                        if (!data.settings) throw new Error('script not updated yet');
                        return data.settings;
                    },
                    'no reply in 15s'
                );
                settings = saved;
                settingsNote = Object.keys(saved).length ? 'from station' : 'defaults (none saved yet)';
            } catch (e) {
                settingsNote = `defaults (${e.message})`;
            }
            updateDiag();
        }

        // ================= AUDIO =================
        function ensureAudio() {
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return false;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return true;
            } catch (e) {
                return false;
            }
        }

        function playChirp() {
            if (!ensureAudio()) return;
            const t = audioCtx.currentTime + 0.02;
            const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
            
            [880, 1320, 1760].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'square';
                o.frequency.value = f;
                g.gain.setValueAtTime(0.0001, t + i * 0.09);
                g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.09 + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.08);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t + i * 0.09);
                o.stop(t + i * 0.09 + 0.13);
            });
        }

        // ================= SPEECH =================
        let speechUnlocked = false;
        function unlockSpeech() {
            if (speechUnlocked || !('speechSynthesis' in window)) return;
            speechUnlocked = true;
            const u = new SpeechSynthesisUtterance(' ');
            u.volume = 0;
            speechSynthesis.speak(u);
        }
        document.addEventListener('touchend', unlockSpeech, { once: true });
        document.addEventListener('click', unlockSpeech, { once: true });

        // Warm up the voice list so the first greeting isn't silent on mobile
        if ('speechSynthesis' in window) {
            try { speechSynthesis.getVoices(); } catch (e) {}
            speechSynthesis.onvoiceschanged = function () { try { speechSynthesis.getVoices(); } catch (e) {} };
            setTimeout(function () { try { speechSynthesis.getVoices(); } catch (e) {} }, 100);
        }

        function safeCancel() {
            if (!('speechSynthesis' in window)) return;
            if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        }

        function speakText(text, onDone) {
            if (!('speechSynthesis' in window)) {
                if (onDone) onDone();
                return;
            }
            try {
                // Clear any stuck utterance (common on Android Chrome)
                if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();

                const u = new SpeechSynthesisUtterance(text);

                // Pitch/rate come from the SAME shared table the Station uses, keyed by the
                // config style — so the greeter and station sound identical.
                const style = (VOICE_STYLES && VOICE_STYLES[VOICE_SETTINGS && VOICE_SETTINGS.style]) ||
                              (VOICE_STYLES && VOICE_STYLES.machine) || { pitch: 0.3, rate: 0.8 };
                u.pitch = style.pitch;
                u.rate = style.rate;
                u.volume = 1;

                // Voice selection matches the station: use the config voiceName if given
                // (exact, then partial for Windows' full names), else the most robotic real
                // voice, else the device default. Only ever assign a REAL voice.
                const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
                const want = (VOICE_SETTINGS && VOICE_SETTINGS.voiceName) || '';
                let voice = null;
                if (want) {
                    voice = voices.find(v => v.name === want) ||
                            voices.find(v => v.name.toLowerCase().includes(want.toLowerCase())) || null;
                }
                if (!voice) voice = voices.find(v => ROBOTIC_VOICE_NAMES.test(v.name)) || null;
                if (voice) { try { u.voice = voice; } catch (e) { /* keep device default */ } }

                let finished = false;
                u.onend = () => { if (!finished) { finished = true; if (onDone) onDone(); } };
                u.onerror = (e) => {
                    if (!finished) { finished = true; console.error('Speech error:', e && e.error); if (onDone) onDone(); }
                };

                speechSynthesis.speak(u);
            } catch (e) {
                console.error('speakText error:', e);
                if (onDone) onDone();
            }
        }

        // ================= GREETING =================
        function greet(name) {
            if (busy) {
                queue.push(name);
                return;
            }
            busy = true;

            document.getElementById('currentName').textContent = name;
            document.getElementById('robotIcon').classList.remove('idle');
            document.getElementById('robotIcon').classList.add('talking');

            const greeting = (settings.greeting || DEFAULT_GREETING).replace(/\{name\}/gi, name);
            
            const finish = () => {
                document.getElementById('robotIcon').classList.remove('talking');
                document.getElementById('robotIcon').classList.add('idle');
                
                const gap = (settings.gap || 6) * 1000;
                setTimeout(() => {
                    busy = false;
                    if (queue.length) {
                        greet(queue.shift());
                    }
                }, gap);
            };

            // Chirp is decorative and must never block or delay the greeting.
            // IMPORTANT: speak SYNCHRONOUSLY (no setTimeout) so mobile browsers, which
            // only allow speech started directly from a tap, don't block it. The chirp
            // plays concurrently via Web Audio.
            if (VOICE_SETTINGS && VOICE_SETTINGS.chirp) {
                try { playChirp(); } catch (e) { console.error('chirp:', e); }
            }
            speakText(greeting, finish);
        }

        function testGreeting() {
            ensureAudio();
            // Speak directly — do NOT use the visitor queue. This guarantees a test can
            // never leave "Test Visitor" queued or interfere with real visitor greetings.
            document.getElementById('currentName').textContent = 'Test Visitor';
            const greeting = (settings.greeting || DEFAULT_GREETING).replace(/\{name\}/gi, 'Test Visitor');
            if (VOICE_SETTINGS && VOICE_SETTINGS.chirp) { try { playChirp(); } catch (e) {} }
            speakText(greeting);
        }

        // ================= FULL SCREEN + LANDSCAPE =================
        function goFullscreen() {
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                        el.mozRequestFullScreen || el.msRequestFullscreen;
            if (req) { try { req.call(el); } catch (e) {} }
        }
        function lockLandscape() {
            // Only works once full-screen / installed (Android). Silently ignored elsewhere.
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {}
        }

        // ================= START =================
        function startGreeter() {
            // Switch screen + start work FIRST so nothing can leave the button stuck.
            started = true;
            lastCount = null;
            busy = false;
            queue.length = 0;   // clear any leftover names so nothing stale is greeted
            goFullscreen();     // request full screen from within the Start tap
            lockLandscape();    // best-effort landscape (works in installed/full-screen mode)
            const startCard = document.getElementById('startCard');
            const runPanel = document.getElementById('runPanel');
            if (startCard) startCard.classList.add('hidden');
            if (runPanel) runPanel.classList.remove('hidden');

            const canSpeak = 'speechSynthesis' in window;
            if (!canSpeak) {
                const w = document.getElementById('warning');
                if (w) {
                    w.textContent = '⚠️ This browser cannot speak. Open the page in Chrome or Safari (not inside another app).';
                    w.classList.remove('hidden');
                }
            }

            // Audio + speech are best-effort; failures must never block startup.
            try { ensureAudio(); } catch (e) { console.error('audio init:', e); }
            if (canSpeak) { try { safeCancel(); speakText('Greeter ready.'); } catch (e) { console.error('greet:', e); } }

            try { keepAwake(); } catch (e) {}
            loadSettings();
            poll();
            setInterval(() => { if (started) loadSettings(); }, SETTINGS_REFRESH_MS);
        }

        let wakeLockBlocked = false;
        async function keepAwake() {
            if (!('wakeLock' in navigator) || wakeLockBlocked) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {
                // NotAllowedError = blocked by permissions policy (in-app browser / iframe)
                // or tab not visible. Not fatal — the greeter still runs.
                wakeLockBlocked = (e && e.name === 'NotAllowedError');
                if (wakeLockBlocked) {
                    const w = document.getElementById('warning');
                    if (w) {
                        w.textContent = '💡 Tip: to stop the screen sleeping, open this page in Chrome/Safari (not inside another app), or set the phone screen timeout to “Never”.';
                        w.classList.remove('hidden');
                    }
                }
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && started) {
                if (!wakeLock && !wakeLockBlocked) keepAwake();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (!polling) { clearTimeout(pollTimer); poll(); }
            }
        });

        // ================= POLLING =================
        async function poll() {
            if (!started || polling) return;
            polling = true;
            lastPollAt = Date.now();
            const status = document.getElementById('status');

            try {
                const data = await readVisitors();
                const count = data.count;
                const recent = data.recent;

                if (lastCount === null || count < lastCount) {
                    lastCount = count;
                } else if (count > lastCount) {
                    const newOnes = Math.min(count - lastCount, recent.length);
                    recent.slice(0, newOnes).reverse().forEach(name => greet(name));
                    lastCount = count;
                }

                status.textContent = '🟢 Listening for new visitors...';
                lastChecked = new Date().toLocaleTimeString();
                updateDiag();
            } catch (e) {
                status.textContent = '🟠 Connection problem: ' + e.message;
                document.getElementById('diag').textContent = 'Error: ' + e.message;
            } finally {
                polling = false;
                if (started) {
                    clearTimeout(pollTimer);
                    pollTimer = setTimeout(poll, POLL_MS);
                }
            }
        }

        // Watchdog
        setInterval(() => {
            if (started && !polling && Date.now() - lastPollAt > POLL_MS * 4) {
                clearTimeout(pollTimer);
                poll();
            }
        }, 5000);

        // Register the service worker so the greeter is an installable full-screen PWA.
        // (Works when served over https, e.g. GitHub Pages — not from a file:// path.)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }

        updateDiag();
    </script>
</body>
</html>
