<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeter Phone - Gen AI Robot City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin: 8px 0;
            font-size: 22px;
            text-shadow: 0 0 15px #00ff88;
        }

        .card {
            background: rgba(45, 55, 72, 0.8);
            border: 2px solid #4a5568;
            border-radius: 15px;
            padding: 22px;
            margin: 20px auto;
            max-width: 480px;
        }

        .btn {
            background: linear-gradient(45deg, #00ff88, #4ecdc4);
            border: none;
            color: #0f0f23;
            padding: 16px 30px;
            border-radius: 30px;
            font-family: inherit;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin: 14px 5px 4px;
        }

        .btn.small {
            font-size: 13px;
            padding: 10px 18px;
            background: #4a5568;
            color: #e2e8f0;
        }

        .big-robot { font-size: 90px; line-height: 1.2; }

        .idle { animation: bob 2.4s ease-in-out infinite; }

        .talking { animation: talk 0.35s ease-in-out infinite alternate; filter: drop-shadow(0 0 18px #ffe66d); }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes talk {
            from { transform: scale(1) rotate(-3deg); }
            to { transform: scale(1.12) rotate(3deg); }
        }

        .label { color: #718096; font-size: 12px; margin-top: 8px; }

        #currentName {
            font-size: 44px;
            color: #ffe66d;
            margin: 10px 0;
            word-break: break-word;
            min-height: 54px;
        }

        #status { color: #4ecdc4; font-size: 14px; margin-top: 8px; }
        .tiny { font-size: 11px; color: #718096; margin-top: 8px; }
        .error { color: #ff6b6b; font-size: 13px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Load shared configuration -->
    <script src="config.js"></script>

    <!-- START -->
    <div id="startCard" class="card">
        <div class="big-robot">🤖</div>
        <h1>GREETER PHONE</h1>
        <p style="font-size: 13px; margin-top: 8px;">Keep this phone next to the mimicking robot. It only says hello to new visitors. All settings are managed from the Tom Station.</p>
        <button class="btn" onclick="startGreeter()">▶ Start Greeter</button>
        <p id="startError" class="error"></p>
        <p class="tiny">Turn the volume up, plug in the charger, and open this page in Chrome or Safari.</p>
    </div>

    <!-- RUNNING -->
    <div id="runPanel" class="card hidden">
        <div id="robotIcon" class="big-robot idle">🤖</div>
        <p class="label">LAST GREETED</p>
        <div id="currentName">—</div>
        <p id="status">Connecting...</p>
        <p id="warning" class="error hidden"></p>
        <button class="btn small" onclick="testGreeting()">🔊 Test greeting</button>
        <p class="tiny" id="diag">greeter v1</p>
    </div>

    <script>
        // ================= CONFIG =================
        // All configuration loaded from config.js
        // VISITOR_API, VOICE_SETTINGS, POLL_MS, REPLY_TIMEOUT, SETTINGS_REFRESH_MS, etc.

        // ================= STATE =================
        let settings = {};                 // saved from the Tom Station (Settings sheet)
        let settingsNote = 'defaults';
        let started = false;
        let polling = false;
        let pollTimer = null;
        let lastPollAt = 0;
        let lastCount = null;
        let lastChecked = '';
        let wakeLock = null;
        let busy = false;
        const queue = [];
        let audioCtx = null;

        // ================= SETTINGS (managed on the Tom Station) =================
        function cfg() {
            const num = (v, d, lo, hi) => {
                const n = parseFloat(v);
                return isNaN(n) ? d : Math.min(hi, Math.max(lo, n));
            };
            
            // Start with defaults from config.js
            const voiceStyle = VOICE_SETTINGS.style || 'machine';
            const voiceFemale = VOICE_SETTINGS.female !== false;
            const voicePitch = VOICE_SETTINGS.pitch || 1.15;
            const voiceRate = VOICE_SETTINGS.rate || 1.15;
            const voiceChirp = VOICE_SETTINGS.chirp !== false;
            
            // Override with spreadsheet settings if available
            return {
                style: ['machine', 'energetic', 'natural'].includes(settings.style) ? settings.style : voiceStyle,
                female: String(settings.female) !== 'false' ? voiceFemale : String(settings.female) === 'true',
                pitch: num(settings.pitch, voicePitch, 0.1, 2),
                rate: num(settings.rate, voiceRate, 0.5, 2),
                gap: num(settings.gap, 6, 2, 20) * 1000,
                greeting: String(settings.greeting || DEFAULT_GREETING).substring(0, 120),
                chirp: String(settings.chirp) !== 'false' ? voiceChirp : String(settings.chirp) === 'true'
            };
        }

        function updateDiag() {
            const url = typeof VISITOR_API !== 'undefined' ? VISITOR_API.slice(-20) : 'NOT LOADED';
            document.getElementById('diag').textContent =
                `greeter v2 • API: ...${url} • settings: ${settingsNote}` + (lastChecked ? ` • checked ${lastChecked}` : '');
        }

        // ================= LOADING DATA FROM GOOGLE =================
        // Loads data like a script file, so browser security rules don't block it
        function loadJsonp(makeSrc, parse, timeoutMsg) {
            return new Promise((resolve, reject) => {
                const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
                const s = document.createElement('script');
                let settled = false;

                const cleanup = () => {
                    settled = true;
                    clearTimeout(timer);
                    window[cb] = function () {};   // ignore any late reply
                    s.remove();
                };

                const timer = setTimeout(() => {
                    if (settled) return;
                    cleanup();
                    reject(new Error(timeoutMsg));
                }, REPLY_TIMEOUT);

                window[cb] = data => {
                    if (settled) return;
                    cleanup();
                    try { resolve(parse(data)); } catch (e) { reject(e); }
                };

                s.onerror = () => {
                    if (settled) return;
                    cleanup();
                    reject(new Error('network problem'));
                };

                s.src = makeSrc(cb);
                document.body.appendChild(s);
            });
        }

        function readVisitors() {
            return loadJsonp(
                cb => `${VISITOR_API}?callback=${cb}&t=${Date.now()}`,
                data => {
                    if (!data) throw new Error('empty reply');
                    if (data.error) throw new Error(data.error);
                    return { count: data.count || 0, recent: data.recent || [] };
                },
                'no reply in 15s'
            );
        }

        async function loadSettings() {
            try {
                const saved = await loadJsonp(
                    cb => `${VISITOR_API}?action=getSettings&callback=${cb}&t=${Date.now()}`,
                    data => {
                        if (!data) throw new Error('empty reply');
                        if (data.error) throw new Error(data.error);
                        if (!data.settings) throw new Error('script not updated yet');
                        return data.settings;
                    },
                    'no reply in 15s'
                );
                settings = saved;
                settingsNote = Object.keys(saved).length ? 'from station' : 'defaults (none saved yet)';
            } catch (e) {
                settingsNote = `defaults (${e.message})`;
            }
            updateDiag();
        }

        // ================= SOUND =================
        function ensureAudio() {
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return false;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return true;
            } catch (e) {
                return false;
            }
        }

        // Short robot "boot chirp" before each greeting
        function playChirp() {
            if (!ensureAudio()) return;
            const t = audioCtx.currentTime + 0.02;
            [880, 1320, 1760].forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'square';
                o.frequency.value = f;
                g.gain.setValueAtTime(0.0001, t + i * 0.09);
                g.gain.exponentialRampToValueAtTime(0.09, t + i * 0.09 + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.08);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t + i * 0.09);
                o.stop(t + i * 0.09 + 0.1);
            });
        }

        // ================= VOICE =================
        // Phones only allow speech that starts from a tap. The first tap anywhere
        // "unlocks" speech so later automatic greetings are allowed too.
        let speechUnlocked = false;
        function unlockSpeech() {
            if (speechUnlocked || !('speechSynthesis' in window)) return;
            speechUnlocked = true;
            const u = new SpeechSynthesisUtterance(' ');
            u.volume = 0;
            speechSynthesis.speak(u);
        }
        document.addEventListener('touchend', unlockSpeech, { once: true });
        document.addEventListener('click', unlockSpeech, { once: true });

        function safeCancel() {
            if (!('speechSynthesis' in window)) return;
            if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        }

        function englishVoices() {
            if (!('speechSynthesis' in window)) return [];
            return speechSynthesis.getVoices()
                .filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
        }

        function pickVoice(c) {
            const voices = englishVoices();
            const prefer_female = c.female !== false;
            return voices.find(v => ROBOTIC_VOICE_NAMES.test(v.name)) ||
                   (prefer_female ? voices.find(v => FEMALE_VOICE_NAMES.test(v.name)) : null) ||
                   voices.find(v => v.lang === 'en-IN') ||
                   voices[0] || null;
        }

        // Say "Gen AI" clearly (some voices read "Gen" as "General")
        function forSpeech(text, wordByWord) {
            return text.replace(/\bGen\s*AI\b/gi, wordByWord ? 'Jen Ay Eye' : 'Jen A I');
        }

        // Speaks a line. "machine" = word. by. word. in a flat rhythm,
        // "energetic" = short punchy phrases, "natural" = one smooth sentence.
        // If the chosen voice fails, it retries once with the phone's default voice.
        function speakLine(text, onDone, useDefaultVoice) {
            let finished = false;
            const finish = () => {
                if (finished) return;
                finished = true;
                if (onDone) onDone();
            };
            if (!('speechSynthesis' in window)) { finish(); return; }

            const c = cfg();
            const spoken = forSpeech(text, c.style === 'machine');
            let parts;
            if (c.style === 'machine') {
                parts = spoken.split(/\s+/).map(w => w.replace(/[^\w']/g, '')).filter(Boolean);
            } else if (c.style === 'energetic') {
                parts = (spoken.match(/[^.!?,]+[.!?,]*/g) || [spoken]).map(s => s.trim()).filter(Boolean);
            } else {
                parts = [spoken];
            }

            const voice = useDefaultVoice ? null : pickVoice(c);
            let retried = false;

            parts.forEach((part, i) => {
                const u = new SpeechSynthesisUtterance(part);
                if (voice) u.voice = voice;
                u.pitch = c.pitch;
                u.rate = c.rate;
                u.volume = 1;

                u.onerror = e => {
                    const err = (e && e.error) ? e.error : 'unknown';
                    if (err === 'interrupted' || err === 'canceled') {
                        if (i === parts.length - 1) finish();
                        return;
                    }
                    if (!useDefaultVoice && !retried) {
                        retried = true;
                        finished = true;   // the retry takes over from here
                        safeCancel();
                        speakLine(text, onDone, true);
                        return;
                    }
                    document.getElementById('diag').textContent = `Voice error: ${err}`;
                    if (i === parts.length - 1) finish();
                };

                if (i === parts.length - 1) u.onend = finish;
                speechSynthesis.speak(u);
            });
            setTimeout(finish, 3000 + parts.length * 1200);   // safety net
        }

        // ================= GREETING QUEUE =================
        function setTalking(on) {
            const icon = document.getElementById('robotIcon');
            icon.classList.toggle('talking', on);
            icon.classList.toggle('idle', !on);
        }

        function greet(name) {
            queue.push(String(name).substring(0, 30));
            processQueue();
        }

        function processQueue() {
            if (busy || queue.length === 0) return;
            busy = true;
            const name = queue.shift();
            const c = cfg();

            document.getElementById('currentName').textContent = name;
            setTalking(true);

            const finish = () => {
                setTalking(false);
                // Stay quiet while the mimicking robot repeats, then take the next visitor
                setTimeout(() => {
                    busy = false;
                    processQueue();
                }, c.gap);
            };

            if (c.chirp) playChirp();
            setTimeout(() => {
                speakLine(c.greeting.replace(/\{name\}/gi, name), finish);
            }, c.chirp ? 400 : 50);
        }

        function testGreeting() {
            ensureAudio();
            greet('Test Visitor');
        }

        // ================= START =================
        function startGreeter() {
            // Verify config.js loaded
            if (typeof VISITOR_API === 'undefined') {
                document.getElementById('startError').textContent = '❌ config.js not loaded. Make sure config.js is in the same folder as this file.';
                return;
            }
            
            ensureAudio();
            const canSpeak = 'speechSynthesis' in window;

            if (canSpeak) {
                safeCancel();
                speakLine('Greeter ready.');
            }

            started = true;
            lastCount = null;   // only greet visitors who arrive from now on
            document.getElementById('startCard').classList.add('hidden');
            document.getElementById('runPanel').classList.remove('hidden');

            if (!canSpeak) {
                const w = document.getElementById('warning');
                w.textContent = '⚠️ This browser cannot speak. Open this page directly in Chrome or Safari.';
                w.classList.remove('hidden');
            }

            keepAwake();
            loadSettings();
            poll();
            setInterval(() => { if (started) loadSettings(); }, SETTINGS_REFRESH_MS);
        }

        // Keep the screen on so the greeter never sleeps
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.log('Wake lock unavailable:', e);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && started) {
                keepAwake();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (!polling) { clearTimeout(pollTimer); poll(); }   // catch up right away
            }
        });

        // ================= WATCH FOR NEW VISITORS =================
        async function poll() {
            if (!started || polling) return;
            polling = true;
            lastPollAt = Date.now();
            const status = document.getElementById('status');

            try {
                const data = await readVisitors();
                const count = data.count;
                const recent = data.recent;   // newest first

                if (lastCount === null || count < lastCount) {
                    lastCount = count;
                } else if (count > lastCount) {
                    const newOnes = Math.min(count - lastCount, recent.length);
                    recent.slice(0, newOnes).reverse().forEach(name => greet(name));
                    lastCount = count;
                }

                status.textContent = '🟢 Listening for new visitors...';
                lastChecked = new Date().toLocaleTimeString();
                updateDiag();
            } catch (e) {
                const errorMsg = e.message || 'unknown error';
                status.textContent = '🟠 Connection problem, retrying...';
                document.getElementById('diag').textContent = `Error: ${errorMsg} • API: ...${VISITOR_API.slice(-20)}`;
            } finally {
                polling = false;
                if (started) {
                    clearTimeout(pollTimer);
                    pollTimer = setTimeout(poll, POLL_MS);
                }
            }
        }

        // Watchdog: restart checking if it ever stops
        setInterval(() => {
            if (started && !polling && Date.now() - lastPollAt > POLL_MS * 4) {
                clearTimeout(pollTimer);
                poll();
            }
        }, 5000);

        // Show config on page load
        updateDiag();
    </script>
</body>
</html>
