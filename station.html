<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Station - Gen AI Robot City</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #00ff88; margin: 10px 0; text-shadow: 0 0 15px #00ff88; }
        h2 { color: #00ff88; font-size: 16px; margin: 15px 0 10px; }
        .card {
            background: rgba(45, 55, 72, 0.8);
            border: 2px solid #4a5568;
            border-radius: 15px;
            padding: 20px;
            margin: 15px auto;
            max-width: 500px;
        }
        .btn {
            background: linear-gradient(45deg, #00ff88, #4ecdc4);
            border: none;
            color: #0f0f23;
            padding: 14px 28px;
            border-radius: 25px;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 4px;
        }
        .btn.small { font-size: 12px; padding: 8px 16px; background: #4a5568; color: #e2e8f0; }
        .setting { text-align: left; margin: 12px 0; font-size: 13px; }
        .setting label { display: block; color: #4ecdc4; margin-bottom: 5px; }
        .select, input { width: 100%; background: rgba(15, 15, 35, 0.8); border: 2px solid #4a5568; border-radius: 8px; padding: 8px; color: #e2e8f0; font-family: inherit; font-size: 14px; }
        #status { color: #4ecdc4; font-size: 14px; margin: 10px 0; }
        #diag { font-size: 11px; color: #718096; margin-top: 8px; }
        .error { color: #ff6b6b; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <h1>🐱 TOM STATION</h1>
    <p style="font-size: 13px; color: #718096;">Gen AI Robot City • Greeting relay</p>

    <!-- SETUP CARD -->
    <div id="setupCard" class="card">
        <h2>⚙️ Settings</h2>
        
        <div class="setting">
            <label>🔊 Voice Style</label>
            <select id="voiceStyle">
                <option value="machine">Machine (word by word)</option>
                <option value="natural">Natural (smooth)</option>
            </select>
        </div>

        <button class="btn small" onclick="testVoice()">▶ Test Voice</button>
        <p id="voiceStatus" style="font-size: 12px; color: #ffe66d; margin-top: 6px;"></p>

        <button class="btn small" onclick="testMusic()" style="margin-top: 10px;">🎵 Test Music</button>
        <p id="musicStatus" style="font-size: 12px; color: #ffe66d; margin-top: 6px;"></p>

        <button class="btn" onclick="startStation()" style="margin-top: 15px;">▶ START STATION</button>
        <p id="setupError" class="error"></p>
    </div>

    <!-- RUNNING CARD -->
    <div id="runningCard" class="card hidden">
        <h2>🟢 STATION RUNNING</h2>
        <p style="font-size: 12px; color: #718096; margin-bottom: 12px;">Listening for new visitors...</p>
        
        <p id="status">Connecting...</p>
        <p id="visitorCount" style="color: #00ff88; margin: 8px 0;"></p>
        
        <button class="btn small" onclick="testGreet()">🔊 Test Greeting</button>
        <button class="btn small" onclick="pauseStation()">⏸️ Pause</button>
    </div>

    <!-- DIAGNOSTICS -->
    <div class="card" style="font-size: 11px; text-align: left; color: #718096;">
        <p><strong>Status:</strong> <span id="configStatus">Checking...</span></p>
        <p id="diag"></p>
    </div>

    <script>
        // ================ SETUP ================
        let audioCtx = null;
        let started = false;
        let polling = false;
        let pollTimer = null;
        let lastCount = null;

        // Check config loaded
        window.addEventListener('load', function() {
            if (typeof VISITOR_API === 'undefined') {
                document.getElementById('configStatus').innerHTML = '❌ config.js NOT loaded';
                document.getElementById('setupError').innerHTML = '❌ config.js missing from folder!';
                return;
            }
            document.getElementById('configStatus').innerHTML = '✅ config.js loaded';
            document.getElementById('diag').textContent = 'API: ...' + VISITOR_API.slice(-15);
        });

        // ================ AUDIO ================
        function ensureAudio() {
            try {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return true;
            } catch (e) {
                console.error('Audio error:', e);
                return false;
            }
        }

        // ================ VOICE ================
        function testVoice() {
            if (!('speechSynthesis' in window)) {
                document.getElementById('voiceStatus').textContent = '❌ Browser cannot speak';
                return;
            }
            ensureAudio();
            const u = new SpeechSynthesisUtterance('Hello! Tom Station is ready.');
            u.pitch = VOICE_SETTINGS.pitch || 1.15;
            u.rate = VOICE_SETTINGS.rate || 1.15;
            u.onstart = () => document.getElementById('voiceStatus').textContent = '🔊 Speaking...';
            u.onend = () => document.getElementById('voiceStatus').textContent = '✅ Voice works';
            u.onerror = (e) => document.getElementById('voiceStatus').textContent = '❌ Voice error: ' + e.error;
            speechSynthesis.speak(u);
        }

        // ================ MUSIC ================
        let musicOn = false;
        let audioNodes = [];

        function testMusic() {
            if (!ensureAudio()) {
                document.getElementById('musicStatus').textContent = '❌ No audio context';
                return;
            }
            
            if (musicOn) {
                audioNodes.forEach(osc => osc.stop());
                audioNodes = [];
                musicOn = false;
                document.getElementById('musicStatus').textContent = '⏹️ Music stopped';
                return;
            }

            musicOn = true;
            document.getElementById('musicStatus').textContent = '🎵 Playing...';

            // Simple sci-fi beeps
            const t = audioCtx.currentTime;
            const freqs = [440, 550, 660, 550];
            
            freqs.forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.value = f;
                o.type = 'square';
                g.gain.setValueAtTime(0, t + i * 0.3);
                g.gain.linearRampToValueAtTime(0.1, t + i * 0.3 + 0.05);
                g.gain.linearRampToValueAtTime(0, t + i * 0.3 + 0.25);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t + i * 0.3);
                o.stop(t + i * 0.3 + 0.3);
                audioNodes.push(o);
            });

            setTimeout(() => {
                musicOn = false;
                document.getElementById('musicStatus').textContent = '✅ Music works';
            }, 1500);
        }

        // ================ GREETING ================
        function greet(name) {
            if (!('speechSynthesis' in window)) return;
            const u = new SpeechSynthesisUtterance(`Hello ${name}! Welcome to Gen AI Robot City!`);
            u.pitch = VOICE_SETTINGS.pitch || 1.15;
            u.rate = VOICE_SETTINGS.rate || 1.15;
            speechSynthesis.speak(u);
        }

        function testGreet() {
            greet('Test Visitor');
        }

        // ================ POLLING ================
        function loadJsonp(url, timeout) {
            return new Promise((resolve, reject) => {
                const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                const script = document.createElement('script');
                
                window[cb] = data => {
                    clearTimeout(timer);
                    script.remove();
                    delete window[cb];
                    resolve(data);
                };

                script.onerror = () => {
                    clearTimeout(timer);
                    script.remove();
                    delete window[cb];
                    reject(new Error('Network error'));
                };

                const timer = setTimeout(() => {
                    script.remove();
                    delete window[cb];
                    reject(new Error('Timeout'));
                }, timeout);

                script.src = url + '?callback=' + cb + '&t=' + Date.now();
                document.body.appendChild(script);
            });
        }

        async function poll() {
            if (!started || polling) return;
            polling = true;
            
            try {
                const data = await loadJsonp(VISITOR_API, REPLY_TIMEOUT || 15000);
                if (!data) throw new Error('Empty response');
                
                const count = data.count || 0;
                const recent = data.recent || [];
                
                document.getElementById('visitorCount').textContent = `Total visitors: ${count}`;
                document.getElementById('status').textContent = '🟢 Listening...';

                if (lastCount === null || count < lastCount) {
                    lastCount = count;
                } else if (count > lastCount) {
                    const newOnes = Math.min(count - lastCount, recent.length);
                    recent.slice(0, newOnes).reverse().forEach(name => greet(name));
                    lastCount = count;
                }
            } catch (e) {
                document.getElementById('status').textContent = '🟠 Error: ' + e.message;
                document.getElementById('diag').textContent = 'Poll error: ' + e.message;
            } finally {
                polling = false;
                if (started) {
                    pollTimer = setTimeout(poll, POLL_MS || 4000);
                }
            }
        }

        // ================ START/PAUSE ================
        function startStation() {
            if (typeof VISITOR_API === 'undefined') {
                document.getElementById('setupError').innerHTML = '❌ config.js not loaded!';
                return;
            }

            testVoice();
            started = true;
            lastCount = null;
            document.getElementById('setupCard').classList.add('hidden');
            document.getElementById('runningCard').classList.remove('hidden');
            poll();
        }

        function pauseStation() {
            started = false;
            clearTimeout(pollTimer);
            document.getElementById('runningCard').classList.add('hidden');
            document.getElementById('setupCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
