<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Station - Gen AI Robot City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin: 10px 0 5px;
            text-shadow: 0 0 15px #00ff88;
        }

        .subtitle { color: #718096; font-size: 13px; margin-bottom: 20px; }

        .card {
            background: rgba(45, 55, 72, 0.8);
            border: 2px solid #4a5568;
            border-radius: 15px;
            padding: 20px;
            margin: 15px auto;
            max-width: 500px;
        }

        .btn {
            background: linear-gradient(45deg, #00ff88, #4ecdc4);
            border: none;
            color: #0f0f23;
            padding: 16px 30px;
            border-radius: 30px;
            font-family: inherit;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 5px;
        }

        .btn.small {
            font-size: 13px;
            padding: 10px 18px;
            background: #4a5568;
            color: #e2e8f0;
        }

        #status { color: #4ecdc4; font-size: 14px; margin-top: 10px; }

        .greeting-label { color: #718096; font-size: 12px; }

        #currentName {
            font-size: 42px;
            color: #ffe66d;
            margin: 10px 0;
            word-break: break-word;
            min-height: 50px;
        }

        .pulse { animation: pulse 1s ease-in-out 4; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: none; }
            50% { transform: scale(1.1); text-shadow: 0 0 25px #ffe66d; }
        }

        #log { list-style: none; text-align: left; font-size: 13px; max-height: 200px; overflow-y: auto; }
        #log li { padding: 6px 0; border-bottom: 1px solid #2d3748; }
        #log .time { color: #718096; margin-right: 8px; }

        .count { font-size: 13px; color: #00ff88; margin-top: 8px; }
        .error { color: #ff6b6b; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🐱 TOM STATION</h1>
    <p class="subtitle">Gen AI Robot City • Greeting relay for Talking Tom</p>

    <div class="card" id="startCard">
        <p>Place this phone next to Talking Tom, turn the volume up, and plug in the charger.</p>
        <button class="btn" onclick="startStation()">▶ Start Station</button>
        <p id="startError" class="error"></p>
    </div>

    <div id="stationPanel" class="hidden">
        <div class="card">
            <p class="greeting-label">LAST GREETED</p>
            <div id="currentName">—</div>
            <p id="status">Connecting to visitor sheet...</p>
            <p class="count" id="visitorTotal"></p>
            <p class="count" id="lastChecked" style="color: #718096;"></p>
            <button class="btn small" onclick="greet('Test Visitor')">🔊 Test Greeting</button>
        </div>

        <div class="card">
            <p class="greeting-label" style="margin-bottom: 8px;">GREETING LOG</p>
            <ul id="log"></ul>
        </div>
    </div>

    <div class="card" style="font-size: 11px; color: #718096; text-align: left;">
        <p><strong>Diagnostics</strong> (station v6 • reads sheet directly)</p>
        <p id="diagLink"></p>
        <p id="diag" style="word-break: break-all;">Waiting to start...</p>
    </div>

    <script>
        // ================= CONFIG =================
        // Your Google Sheet ID (share it as "Anyone with the link → Viewer")
        const SHEET_ID = '1Ft_qacgU9QPFXL_AwEx8xrliJkgZ60D-WmcB76xHIQE';
        const SHEET_TAB = 'Visitors';

        const POLL_MS = 4000;          // check for new visitors every 4 seconds
        const REPLY_TIMEOUT = 20000;   // wait up to 20 seconds for Google to reply
        const TOM_REPEAT_GAP = 6000;   // pause after each greeting so Tom can repeat it

        let lastCount = null;
        let started = false;
        let wakeLock = null;
        const queue = [];
        let busy = false;
        let polling = false;
        let pollTimer = null;
        let lastPollAt = 0;

        // ================= DIAGNOSTICS =================
        function showDiag(msg) {
            document.getElementById('diag').textContent = msg;
        }

        document.getElementById('diagLink').textContent =
            `Sheet ID ends with: ...${SHEET_ID.slice(-10)} • Tab: ${SHEET_TAB}`;

        // ================= READ THE SHEET =================
        // Loads the Name column straight from the Google Sheet (like loading a script file)
        function readVisitors() {
            return new Promise((resolve, reject) => {
                const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
                const s = document.createElement('script');
                let settled = false;

                const cleanup = () => {
                    settled = true;
                    clearTimeout(timer);
                    window[cb] = function () {};   // ignore any late reply
                    s.remove();
                };

                const timer = setTimeout(() => {
                    if (settled) return;
                    cleanup();
                    reject(new Error('No reply in 20s. Is the sheet shared as "Anyone with the link → Viewer"?'));
                }, REPLY_TIMEOUT);

                window[cb] = response => {
                    if (settled) return;
                    cleanup();
                    if (!response || response.status === 'error') {
                        const msg = response && response.errors && response.errors[0]
                            ? response.errors[0].detailed_message || response.errors[0].message
                            : 'Unknown sheet error';
                        reject(new Error(msg));
                        return;
                    }
                    const rows = (response.table && response.table.rows) || [];
                    const names = rows
                        .map(r => (r.c && r.c[0] && r.c[0].v != null) ? String(r.c[0].v) : '')
                        .filter(n => n !== '');
                    resolve(names);
                };

                s.onerror = () => {
                    if (settled) return;
                    cleanup();
                    reject(new Error('Could not load the sheet (network problem).'));
                };

                const query = encodeURIComponent('select B where B is not null');
                s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
                        `?tqx=responseHandler:${cb}&headers=1` +
                        `&sheet=${encodeURIComponent(SHEET_TAB)}&tq=${query}&t=${Date.now()}`;
                document.body.appendChild(s);
            });
        }

        // ================= VOICE =================
        function pickVoice() {
            const voices = speechSynthesis.getVoices();
            return voices.find(v => v.lang === 'en-IN') ||
                   voices.find(v => v.lang && v.lang.startsWith('en')) || null;
        }

        function makeUtterance(text) {
            const u = new SpeechSynthesisUtterance(text);
            const voice = pickVoice();
            if (voice) u.voice = voice;
            u.rate = 0.95;   // slightly slower so Tom records it clearly
            u.pitch = 1.1;
            return u;
        }

        // ================= START =================
        function startStation() {
            if (!('speechSynthesis' in window)) {
                document.getElementById('startError').textContent =
                    'This browser cannot speak. Try Chrome or Safari.';
                return;
            }

            // Speaking inside the tap unlocks voice for the rest of the session
            speechSynthesis.speak(makeUtterance('Tom station is ready.'));

            started = true;
            document.getElementById('startCard').classList.add('hidden');
            document.getElementById('stationPanel').classList.remove('hidden');
            keepAwake();
            poll();
        }

        // Keep the screen on so the station never sleeps
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.log('Wake lock unavailable:', e);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && started) {
                keepAwake();
                if (!polling) { clearTimeout(pollTimer); poll(); }  // catch up right away
            }
        });

        // ================= WATCH FOR NEW VISITORS =================
        function schedulePoll(delay) {
            clearTimeout(pollTimer);
            pollTimer = setTimeout(poll, delay);
        }

        async function poll() {
            if (polling) return;
            polling = true;
            lastPollAt = Date.now();
            const status = document.getElementById('status');

            try {
                const names = await readVisitors();
                const count = names.length;
                const recent = names.slice(-5).reverse();   // newest first

                showDiag(`OK • ${count} visitors • newest: ${recent.join(', ') || 'none yet'}`);
                document.getElementById('visitorTotal').textContent = `Total visitors: ${count}`;

                if (lastCount === null || count < lastCount) {
                    lastCount = count;
                } else if (count > lastCount) {
                    const newOnes = Math.min(count - lastCount, recent.length);
                    recent.slice(0, newOnes).reverse().forEach(name => greet(name));
                    lastCount = count;
                }

                status.textContent = '🟢 Watching for new visitors...';
                document.getElementById('lastChecked').textContent =
                    `Last checked: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                status.textContent = '🟠 Connection problem, retrying...';
                showDiag('Error: ' + e.message);
            } finally {
                polling = false;
                schedulePoll(POLL_MS);
            }
        }

        // Watchdog: restart checking if it ever stops
        setInterval(() => {
            if (started && !polling && Date.now() - lastPollAt > POLL_MS * 4) {
                clearTimeout(pollTimer);
                poll();
            }
        }, 5000);

        // ================= GREETING QUEUE =================
        function greet(name) {
            queue.push(String(name).substring(0, 30));
            processQueue();
        }

        function processQueue() {
            if (busy || queue.length === 0) return;
            busy = true;
            const name = queue.shift();

            const nameEl = document.getElementById('currentName');
            nameEl.textContent = name;
            nameEl.classList.remove('pulse');
            void nameEl.offsetWidth;
            nameEl.classList.add('pulse');
            addLog(name);

            let finished = false;
            const done = () => {
                if (finished) return;
                finished = true;
                setTimeout(() => { busy = false; processQueue(); }, TOM_REPEAT_GAP);
            };

            const u = makeUtterance(`Hello ${name}! Welcome to Gen AI Robot City!`);
            u.onend = done;
            u.onerror = done;
            setTimeout(done, 10000); // safety net if the browser never reports "end"
            speechSynthesis.speak(u);
        }

        function addLog(name) {
            const li = document.createElement('li');
            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            li.appendChild(time);
            li.appendChild(document.createTextNode(`Greeted ${name}`));
            const log = document.getElementById('log');
            log.insertBefore(li, log.firstChild);
        }
    </script>
</body>
</html>
